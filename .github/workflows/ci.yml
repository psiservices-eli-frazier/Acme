name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Acme.slnx

      - name: Build
        run: dotnet build Acme.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Acme.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: ./TestResults/**/*.trx
          retention-days: 14

  client:
    name: Client (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/web.client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish:
    name: Publish (package)
    needs: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web.client/package-lock.json

      - name: Build client into wwwroot
        working-directory: src/web.client
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server (framework-dependent, portable)
        run: >
          dotnet publish src/Acme.Server/Acme.Server.csproj
          --configuration Release
          --output ./publish

      - name: Seed demo database
        working-directory: ./publish
        run: dotnet Acme.Server.dll --seed

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: acme-server-${{ github.sha }}
          path: ./publish
          retention-days: 14

  # ---------------------------------------------------------------------
  # Deploy job placeholder — target/host not yet decided.
